<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Holiday Team Fused</title>
  <style>
    :root { color-scheme: dark; font: 100% system-ui, sans-serif; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: radial-gradient(ellipse at top right, #32265f, transparent 55%), #101122; color: #f9f5ee; }
    main { box-sizing: border-box; width: min(38rem, calc(100% - 2rem)); padding: clamp(1.5rem, 6vw, 3rem); background: #191b35; border: 1px solid #535477; border-radius: 1.25rem; }
    h1 { font-size: clamp(2rem, 7vw, 3.5rem); line-height: 1.05; margin: 0; }
    p { color: #d3d1e5; line-height: 1.55; margin: 1rem 0 1.5rem; }
    a { color: #dbf979; }
    .open-game { display: inline-block; padding: .8rem 1rem; border-radius: .7rem; background: #dbf979; color: #151729; font-weight: 750; text-decoration: none; }
    footer { margin-top: 1.5rem; }
  </style>
</head>
<body>
  <main>
    <h1>Holiday Team Fused</h1>
    <p>Open the hosted game to create a room, join a team, or watch a live game.</p>
    <a class="open-game" id="open-game" href="https://crowd-score-survey-game.mistycone2.chatgpt.site/">Open hosted game</a>
    <footer><a href="https://github.com/STEM-Solano/HolidayGame#run-on-a-local-network">Run your own game</a></footer>
  </main>
  <script>
    const params = new URLSearchParams(location.search);
    const room = params.get('room')?.toUpperCase();
    if (room && /^[A-Z0-9]{6}$/.test(room)) {
      const link = document.getElementById('open-game');
      const game = new URL(link.href);
      game.searchParams.set('room', room);
      if (params.get('watch') === '1') game.searchParams.set('watch', '1');
      link.href = game.href;
      link.textContent = params.get('watch') === '1' ? 'Watch this room' : 'Join this room';
    }
  </script>
</body>
</html>
